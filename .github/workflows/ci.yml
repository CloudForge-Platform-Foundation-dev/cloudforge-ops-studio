name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-openapi-spec:
    runs-on: ubuntu-latest
    outputs:
      has_spec: ${{ steps.detect.outputs.has_spec }}
      spec_path: ${{ steps.detect.outputs.spec_path }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f openapi.yaml ]; then
            echo "has_spec=true" >> $GITHUB_OUTPUT
            echo "spec_path=openapi.yaml" >> $GITHUB_OUTPUT
          elif [ -f openapi.json ]; then
            echo "has_spec=true" >> $GITHUB_OUTPUT
            echo "spec_path=openapi.json" >> $GITHUB_OUTPUT
          else
            echo "has_spec=false" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check file encodings (UTF-8, no BOM)
        run: python scripts/check_encoding.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  validate:
    needs: detect-openapi-spec
    if: needs.detect-openapi-spec.outputs.has_spec == 'true'
    uses: CloudForge-Platform-Foundation-dev/foundation-validation/.github/workflows/reusable-gate.yml@v1.0.2
    with:
      spec_path: ${{ needs.detect-openapi-spec.outputs.spec_path }}
      engine_ref: v1.0.2
    secrets:
      foundation_pat: ${{ secrets.FOUNDATION_PAT }}
